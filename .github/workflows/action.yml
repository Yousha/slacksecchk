name: Compile and Test

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Update package index
        run: sudo apt-get update

      - name: Install build and lint tools
        run: sudo apt-get install --no-install-recommends -y build-essential yamllint

      - name: Lint YAML files
        run: find . -type f \( -name "*.yml" -o -name "*.yaml" \) -not -path "./.git/*" -print0 | xargs -0 -r yamllint -d relaxed

      - name: Clean
        run: make clean

      - name: Check for non-Slackware service managers
        run: if grep -R -nE 'systemctl|(^|[[:space:]])service[[:space:]]+[[:alnum:]_-]+[[:space:]]+(status|start|stop|restart)' src; then echo 'Use Slackware rc scripts instead of systemd/service commands.'; exit 1; fi

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Verify checksum generation
        run: make checksums && sha256sum -c Checksums.sha256 && rm -f Checksums.sha256
